    <script>
      (function() {
        // 🛡️ Root Global Security Shield (Runs Before Any DOM / Page Load)
        window.addEventListener('contextmenu', function(e) { e.preventDefault(); e.stopPropagation(); return false; }, true);
        window.addEventListener('keydown', function(e) {
          if (e.keyCode === 123 || e.key === 'F12') { e.preventDefault(); e.stopPropagation(); return false; }
          if ((e.ctrlKey || e.metaKey) && (e.key === 'u' || e.key === 'U' || e.key === 's' || e.key === 'S' || e.key === 'p' || e.key === 'P')) { e.preventDefault(); e.stopPropagation(); return false; }
          if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'i' || e.key === 'I' || e.key === 'j' || e.key === 'J' || e.key === 'c' || e.key === 'C')) { e.preventDefault(); e.stopPropagation(); return false; }
        }, true);
        window.addEventListener('selectstart', function(e) {
          if (e.target && e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') { e.preventDefault(); return false; }
        }, true);
        window.addEventListener('dragstart', function(e) { e.preventDefault(); return false; }, true);
      })();
